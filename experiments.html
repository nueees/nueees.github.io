<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiments - Seeeun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #fff;
            padding: 40px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 60px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .back-link {
            color: #666;
            text-decoration: none;
            font-size: 0.9em;
            border-bottom: 1px solid #666;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.6;
        }

        .intro {
            margin-bottom: 50px;
            color: #666;
            font-size: 1.1em;
        }

        .experiment {
            margin-bottom: 60px;
            padding-bottom: 40px;
            border-bottom: 1px solid #e0e0e0;
        }

        .experiment:last-child {
            border-bottom: none;
        }

        .experiment h2 {
            font-size: 1.8em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .experiment .date {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .experiment p {
            margin-bottom: 15px;
            color: #444;
        }

        .tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .tag {
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 3px;
            font-size: 0.85em;
            color: #666;
        }

        footer {
            margin-top: 80px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-link">← Back to home</a>
        <h1>Creative Experiments</h1>
    </header>

    <div class="intro">
        <p>A collection of things I make - code, art, observations, essays. Not work stuff. Just experiments that capture what I'm thinking about or noticing in the world right now.</p>
    </div>

    <article class="experiment">
        <h2>No Title</h2>
        <div class="date">October 2025</div>
        <p>Working In Progress</p>
        <p>...</p>
        <div class="tags">
            <span class="tag">factory</span>
            <span class="tag">machine</span>
        </div>
    </article>
    <footer>
        <p>© 2025 Seeeun</p>
    </footer>
</body>
</html>
